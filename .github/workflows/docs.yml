name: Docs
on:
  pull_request:
    paths: ["docs/**"]
  push:
    branches: ["main"]
    paths: ["docs/**"]
  workflow_dispatch: {}

env:
  PUPPETEER_SKIP_DOWNLOAD: 1
  PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

jobs:
  lint:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      # Uses `<repo>@<sha>` instead of "./" so the action (and its
      # node_modules) is checked out separately from the gh-pages working tree.
      # Note: `uses:` only supports the `github`/`needs` contexts, not `steps`,
      # so the ref/repo must be computed inline here.
      - uses: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}@${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        with:
          SOURCE: docs/index.html
          DESTINATION: index.html
          TOOLCHAIN: respec
          GH_PAGES_BRANCH: gh-pages
